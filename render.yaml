services:
  - type: web
    name: face-recognition-api
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r server/requirements-render.txt
    startCommand: python scripts/start_server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: RECOGNITION_THRESHOLD
        value: 0.45
      - key: DEEPFACE_MODEL
        value: ArcFace
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
    autoDeploy: true

  - type: pserv
    name: face-recognition-db
    env: postgresql
    region: singapore
    plan: starter
    envVars:
      - key: POSTGRES_DB
        value: face
      - key: POSTGRES_USER
        value: postgres

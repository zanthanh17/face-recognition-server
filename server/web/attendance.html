<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History In/Out - FaceLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/pages.css" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/web/users.html" class="sidebar-brand">
                <i class="fas fa-user-shield"></i>
                <span>FaceLog</span>
            </a>
        </div>
        
        <nav class="sidebar-nav">
            <div class="nav-item">
                <a href="/web/users.html" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
            </div>
            
            <div class="nav-item">
                <a href="/web/attendance.html" class="nav-link active">
                    <i class="fas fa-clock"></i>
                    <span>Attendance</span>
                </a>
            </div>
            
            <div class="nav-item">
                <a href="/web/workhours.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Time Tracking</span>
                </a>
            </div>
            
            <div class="nav-item mt-auto">
                <a href="#" class="nav-link" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Header -->
        <div class="top-header">
            <h1 class="page-title">Attendance Management</h1>
            <div class="header-actions">
                <button class="btn btn-success" onclick="exportCSV()">
                    <i class="fas fa-download"></i>
                    Export CSV
                </button>
                <button class="btn btn-primary" onclick="refreshData()">
                    <i class="fas fa-sync"></i>
                    Refresh
                </button>
                <button class="btn btn-warning" onclick="cleanupData()">
                    <i class="fas fa-broom"></i>
                    Cleanup Data
                </button>
                <button class="btn btn-danger" onclick="resetAll()">
                    <i class="fas fa-undo"></i>
                    Reset All
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-list"></i>
                        </div>
                    </div>
                    <div class="stat-number" id="totalLogs">0</div>
                    <div class="stat-label">Total Logs</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-calendar-day"></i>
                        </div>
                    </div>
                    <div class="stat-number" id="todayLogs">0</div>
                    <div class="stat-label">Today's Logs</div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-user-check"></i>
                        </div>
                    </div>
                    <div class="stat-number" id="activeUsers">0</div>
                    <div class="stat-label">Active Users</div>
                </div>
            </div>

            <!-- Main Card -->
            <div class="main-card">
                <div class="card-header">
                    <h2 class="card-title">Attendance Logs</h2>
                </div>
                
                <!-- Filters Section -->
                <div class="filters-section">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="dateFilter">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">User</label>
                            <select class="form-control" id="userFilter">
                                <option value="">All Users</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Status</label>
                            <select class="form-control" id="statusFilter">
                                <option value="">All Status</option>
                                <option value="matched">Matched</option>
                                <option value="unmatched">Unmatched</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- Table -->
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>TIME</th>
                                    <th>USER</th>
                                    <th>STATUS</th>
                                    <th>DISTANCE</th>
                                    <th>IMAGE</th>
                                </tr>
                            </thead>
                            <tbody id="attendanceTableBody">
                                <tr>
                                    <td colspan="5" class="text-center">Loading attendance logs...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/attendance.js"></script>
    
    <script>
        // Logout function
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }
        
        // Export CSV function
        function exportCSV() {
            console.log('Export CSV clicked');
        }
        
        // Refresh data function
        function refreshData() {
            console.log('Refresh clicked');
        }
        
        // Cleanup data function
        function cleanupData() {
            console.log('Cleanup Data clicked');
        }
        
        // Reset all function
        function resetAll() {
            console.log('Reset All clicked');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking - FaceLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css?v=2.0" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #3b82f6;
            --accent-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --info-color: #06b6d4;
            --sidebar-bg: #1e293b;
            --sidebar-hover: #334155;
            --sidebar-active: #3b82f6;
            --light-bg: #f8fafc;
            --dark-text: #1e293b;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8fafc;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--dark-text);
            line-height: 1.6;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 70px;
            background: var(--sidebar-bg);
            color: white;
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
        }

        .sidebar:hover {
            width: 280px;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar:hover .sidebar-header {
            padding: 1.5rem;
            justify-content: space-between;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .sidebar-brand span {
            display: none;
        }

        .sidebar:hover .sidebar-brand span {
            display: inline;
        }

        .sidebar-brand i {
            font-size: 1.75rem;
            color: var(--secondary-color);
        }

        .sidebar-nav {
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 80px);
        }

        .nav-item {
            margin: 0.25rem 0;
        }

        .nav-item.mt-auto {
            margin-top: auto;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            color: #cbd5e1;
            text-decoration: none;
            transition: var(--transition);
            border-radius: 0;
            justify-content: center;
        }

        .sidebar:hover .nav-link {
            padding: 0.75rem 1.5rem;
            justify-content: flex-start;
        }

        .nav-link span {
            display: none;
        }

        .sidebar:hover .nav-link span {
            display: inline;
        }

        .nav-link:hover {
            background: var(--sidebar-hover);
            color: white;
        }

        .nav-link.active {
            background: var(--sidebar-active);
            color: white;
            border-right: 3px solid white;
        }

        .nav-link i {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-wrapper {
            margin-left: 70px;
            min-height: 100vh;
            background: #f8fafc;
        }

        /* Top Header */
        .top-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .page-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--dark-text);
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            transition: var(--transition);
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #1e3a8a;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--dark-text);
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
            color: var(--dark-text);
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            color: white;
        }

        .btn-danger {
            background: var(--accent-color);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            color: white;
        }

        /* Content Area */
        .content-area {
            padding: 2rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: var(--box-shadow);
            border: 1px solid #e2e8f0;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
        }

        .stat-card:nth-child(1) .stat-icon { background: var(--primary-color); }
        .stat-card:nth-child(2) .stat-icon { background: var(--success-color); }
        .stat-card:nth-child(3) .stat-icon { background: var(--accent-color); }
        .stat-card:nth-child(4) .stat-icon { background: var(--info-color); }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-text);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Main Content Card */
        .main-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .card-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--dark-text);
            margin: 0;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Filters */
        .filters-section {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 1.5rem;
        }

        .form-control {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            transition: var(--transition);
            background: white;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
            outline: none;
        }

        /* Table */
        .table {
            background: white;
            margin: 0;
        }

        .table th {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            color: var(--dark-text);
            padding: 1rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
            font-size: 0.875rem;
        }

        .table tbody tr:hover {
            background: #f8fafc;
        }

        /* Badges */
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }

        /* Modal */
        .modal-content {
            border-radius: var(--border-radius);
            border: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            background: var(--primary-color);
            color: white;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            padding: 1.5rem;
        }

        .modal-header .btn-close {
            filter: invert(1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .main-wrapper {
                margin-left: 0;
            }
            
            .content-area {
                padding: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="/web/users.html" class="sidebar-brand">
                <i class="fas fa-user-shield"></i>
                <span>FaceLog</span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-item">
                <a href="/web/users.html" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>Users</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="/web/attendance.html" class="nav-link">
                    <i class="fas fa-history"></i>
                    <span>History In/Out</span>
                </a>
            </div>
            <div class="nav-item">
                <a href="/web/workhours.html" class="nav-link active">
                    <i class="fas fa-clock"></i>
                    <span>Time Tracking</span>
                </a>
            </div>
            <div class="nav-item mt-auto">
                <a href="#" class="nav-link" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
        </div>
    </nav>
                    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Header -->
        <div class="top-header">
            <h1 class="page-title">Time Tracking</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="workHoursManager.exportData()">
                    <i class="fas fa-download"></i>
                    Export CSV
                        </button>
                <button class="btn btn-secondary" onclick="workHoursManager.refreshData()">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                        </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Alert Container -->
            <div id="alertContainer"></div>

        <!-- Stats Cards -->
            <div class="stats-grid fade-in">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                    <div class="stat-number" id="total-workers">0</div>
                    <div class="stat-label">Total Workers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-clock"></i>
            </div>
                    </div>
                    <div class="stat-number" id="total-hours">0h</div>
                    <div class="stat-label">Total Hours</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-user-check"></i>
            </div>
                    </div>
                    <div class="stat-number" id="active-workers">0</div>
                    <div class="stat-label">Workers Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon">
                            <i class="fas fa-chart-line"></i>
            </div>
                    </div>
                    <div class="stat-number" id="avg-hours">0h</div>
                    <div class="stat-label">Average/Person</div>
            </div>
        </div>

            <!-- Main Card -->
            <div class="main-card fade-in">
                <!-- Filters Section -->
                <div class="filters-section">
                    <div class="row g-3">
            <div class="col-md-4">
                            <label class="form-label">Select Date</label>
                <input type="date" class="form-control" id="selectedDate" value="">
            </div>
            <div class="col-md-4">
                            <label class="form-label">From Date</label>
                <input type="date" class="form-control" id="startDate">
            </div>
            <div class="col-md-4">
                            <label class="form-label">To Date</label>
                <input type="date" class="form-control" id="endDate">
            </div>
        </div>

        <!-- View Toggle -->
                    <div class="row mt-3">
            <div class="col-12">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="viewMode" id="dailyView" value="daily" checked>
                    <label class="btn btn-outline-primary" for="dailyView">
                                    <i class="fas fa-calendar-day"></i> Daily View
                    </label>
                    
                    <input type="radio" class="btn-check" name="viewMode" id="summaryView" value="summary">
                    <label class="btn btn-outline-primary" for="summaryView">
                                    <i class="fas fa-calendar-week"></i> Summary View
                    </label>
                </div>
            </div>
        </div>
            </div>

                <!-- Table Section -->
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="workHoursTable">
                        <thead>
                            <tr>
                                    <th>USER</th>
                                    <th>DATE</th>
                                    <th>FIRST CHECK IN</th>
                                    <th>LAST CHECK OUT</th>
                                    <th>TOTAL HOURS</th>
                                    <th>SCAN COUNT</th>
                                    <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="workHoursTableBody">
                            <tr>
                                <td colspan="7" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="row mt-4">
            <div class="col-md-6">
                    <div class="main-card">
                    <div class="card-header">
                            <h5 class="card-title">
                                <i class="fas fa-chart-bar"></i>
                                Hours by User
                        </h5>
                    </div>
                    <div class="card-body">
                        <canvas id="userHoursChart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                    <div class="main-card">
                    <div class="card-header">
                            <h5 class="card-title">
                                <i class="fas fa-chart-line"></i>
                                Hours Trend
                        </h5>
                    </div>
                    <div class="card-body">
                        <canvas id="trendChart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/workhours.js?v=1.2"></script>
    <script>
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/';
                return;
            }

            // Initialize work hours manager
            if (typeof WorkHoursManager !== 'undefined') {
                window.workHoursManager = new WorkHoursManager();
            }
        });
    </script>
</body>
</html>
